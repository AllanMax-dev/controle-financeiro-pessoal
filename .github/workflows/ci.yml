name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: controle_financeiro_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/controle_financeiro_ci
      APP_URL: http://localhost:3000
      WORKSPACE_SLUG: controle-financeiro
      WORKSPACE_NAME: Controle Financeiro
      INITIAL_EDITOR_NAME: Allan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate Prisma
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Migrations
        run: npx prisma migrate deploy

      - name: Seed
        run: npm run seed

      - name: Check Encoding
        run: npm run check:encoding

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check Financial Invariants
        run: npm run test:invariants

      - name: Run Read-Only Database Baseline
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/database-integrity-audit.sql

      - name: Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E Smoke
        run: npm run test:e2e
